<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Kourosh project opener</title>
    <style>
        @font-face {
            font-family: B Homa;
            src: url("B Homa.ttf");
        }

        body {
            background-color: skyblue;
            font-family: "B Homa", Arial;
            font-size: 25px;
            text-align: center;
        }

        button {
            font-family: "B Homa", Arial;
            font-size: 25px;
            background-color: green;
            color: white;
            border-radius: 20%;
        }

        input {
            font-family: "B Homa", Arial;
            font-size: 25px;
            text-align: center;
            width: 99%;
        }

        @media (hover: none) and (pointer: coarse) {
            body {
                font-size: 50px;
                touch-action: manipulation;
            }

            button {
                font-size: 70px;
                height: 150px;
            }

            input {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>
    <h1>Kourosh project opener</h1>
    <input type="text" id="projectName" placeholder="Type project name" lang="auto" dir="auto">
    <br><br>
    <button
        onclick="window.location.href = `https://kourosh394.github.io/Persian-projects/${document.getElementById('projectName').value}/main.html`">open</button>
</body>

</html>
